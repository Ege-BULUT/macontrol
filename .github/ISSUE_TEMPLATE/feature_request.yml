name: Feature request
description: Suggest a change or a new feature.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you considered, including other tools or workarounds.
  - type: dropdown
    id: area
    attributes:
      label: Screen or area
      options:
        - Overview
        - Disk Map
        - Clean
        - Uninstall
        - Debloat
        - History
        - Scanning and performance
        - Install and permissions
        - Other
    validations:
      required: true
