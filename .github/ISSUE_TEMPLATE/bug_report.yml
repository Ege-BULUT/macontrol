name: Bug report
description: Something in macontrol does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If macontrol offered to remove, or removed, something it should not have, use the **Safety report** form instead. Security vulnerabilities go through [SECURITY.md](https://github.com/Ege-BULUT/macontrol/blob/main/SECURITY.md), not a public issue.
  - type: input
    id: version
    attributes:
      label: macontrol version
      description: From Macontrol › About Macontrol, or the name of the zip you downloaded.
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.6
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model and chip
      placeholder: MacBook Air, M2
    validations:
      required: true
  - type: dropdown
    id: fda
    attributes:
      label: Full Disk Access
      options:
        - "On"
        - "Off"
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: screen
    attributes:
      label: Screen
      options:
        - Overview
        - Disk Map
        - Clean
        - Uninstall
        - Debloat
        - History
        - Other, or more than one
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Disk Map and scan the home folder.
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here. Crop or blur anything you do not want to share.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no personal file paths I don't want to share.
          required: true
